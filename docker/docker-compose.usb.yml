# Merge: docker compose -f docker-compose.yml -f docker-compose.usb.yml …
# Pico plugged into the Dev-Host. Privileged /dev for picotool (BOOTSEL) and ACM.

name: ir-remote-bose

services:
  pico-dev:
    user: "0:0"
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /dev:/dev
    group_add:
      - dialout
    environment:
      PICO_SDK_PATH: /opt/pico-sdk
      PYTHONPATH: /workspace
