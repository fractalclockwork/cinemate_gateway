# Prime Video player + gateway pointer/focus bindings.
# Published shortcuts: https://www.primevideo.com/help?nodeId=GE4VW9VWJD7FM6DR
# Page▲/Channel▲ share IR 1a:10:9a; Page▼/Channel▼ share 1a:11:9a — one HID each
# (Up/Down + hold ramp; same as VCR channel). See amazon-chrome-shortcuts.md.
id: amazon
surface: player
source: https://www.primevideo.com/help?nodeId=GE4VW9VWJD7FM6DR
remote: sony-dvr-20636
controls:
  up: {hid: MOUSE_UP, ui: pointer_up}
  down: {hid: MOUSE_DOWN, ui: pointer_down}
  left: {hid: MOUSE_LEFT, ui: pointer_left}
  right: {hid: MOUSE_RIGHT, ui: pointer_right}
  enter: {hid: MOUSE_LEFT_CLICK, ui: click}
  back: {hid: ESCAPE, ui: exit_playback}
  play: {hid: SPACE, ui: play_pause}
  pause: {hid: SPACE, ui: play_pause}
  stop: {hid: null, ui: unbound}
  ffw: {hid: RIGHT, ui: seek_forward}
  frw: {hid: LEFT, ui: seek_back}
  # Forward curved arrow. Record owns fullscreen; this switches windows.
  quick_skip: {hid: ALT_TAB, ui: switch_window}
  # Backward curved arrow (Instant Replay). Same IR as previous: 1a:5b:9a.
  instant_replay: {hid: SHIFT_ALT_TAB, ui: switch_window_prev}
  record: {hid: F, ui: fullscreen}
  # Shared IR with page_* (AUX capture: 1a:10/11 then [dup] on page vs channel).
  channel_up: {hid: UP, ui: arrow_up}
  channel_down: {hid: DOWN, ui: arrow_down}
  page_up: {hid: null, ui: alias_channel_up_ir}
  page_down: {hid: null, ui: alias_channel_down_ir}
  "0": {hid: null, ui: unbound}
  "1": {hid: null, ui: unbound}
  "2": {hid: null, ui: unbound}
  "3": {hid: null, ui: unbound}
  "4": {hid: null, ui: unbound}
  "5": {hid: null, ui: unbound}
  "6": {hid: null, ui: unbound}
  "7": {hid: null, ui: unbound}
  "8": {hid: null, ui: unbound}
  "9": {hid: null, ui: unbound}
