# Paramount+ accessibility shortcuts.
# Space is play/pause in the player and also jumps a section while browsing.
# Seek is J/L. Left/Right are not the documented seek keys.
id: paramount
surface: player
source: https://support.paramountplus.com/s/article/PI-What-accessibility-features-does-Paramount-offer
remote: sony-dvr-20636
controls:
  up: {hid: UP, ui: volume_up}
  down: {hid: DOWN, ui: volume_down}
  left: {hid: LEFT, ui: arrow}
  right: {hid: RIGHT, ui: arrow}
  enter: {hid: ENTER, ui: select}
  back: {hid: null, ui: unbound}
  play: {hid: SPACE, ui: play_pause}
  pause: {hid: SPACE, ui: play_pause}
  stop: {hid: null, ui: unbound}
  ffw: {hid: L, ui: seek_forward}
  frw: {hid: J, ui: seek_back}
  "0": {hid: null, ui: unbound}
  "1": {hid: null, ui: unbound}
  "2": {hid: null, ui: unbound}
  "3": {hid: null, ui: unbound}
  "4": {hid: null, ui: unbound}
  "5": {hid: null, ui: unbound}
  "6": {hid: null, ui: unbound}
  "7": {hid: null, ui: unbound}
  "8": {hid: null, ui: unbound}
  "9": {hid: null, ui: unbound}
